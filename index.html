.ed2{color:var(--mu);font-size:13px}input[type=color]{width:28px;height:24px;padding:0;border:0;background:none;cursor:pointer}

function b64(s){var b=new TextEncoder().encode(s),r="",i=0;for(;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)}
async function save(){msg("Enregistrement…");
try{var cur=await gh("GET","/contents/"+GH.p),h=new TextDecoder().decode(Uint8Array.from(atob(cur.content.replace(/\n/g,"")),function(c){return c.charCodeAt(0)})),re=/var DATA=\/\*S\*\/[\s\S]*?\/\*E\*\/;/;
if(!re.test(h))throw new Error("repères de données introuvables dans le fichier du dépôt");
var j=JSON.stringify(DATA).replace(/</g,"\\u003c"),n=h.replace(re,function(){return"var DATA=/*S*/"+j+"/*E*/;"});
await gh("PUT","/contents/"+GH.p,{message:"Mise à jour du contenu",content:b64(n),sha:cur.sha});
SAVED=JSON.stringify(DATA);ED=false;draw();msg("Enregistré ✔ — visible en ligne dans quelques secondes")}
catch(e){msg("Échec : "+e.message)}}
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.e!==undefined)setp(t.dataset.e,t.textContent)});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.e!==undefined){e.preventDefault();e.target.blur()}});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.c){setp(t.dataset.c,t.value);draw()}});
document.addEventListener("click",function(e){var t=e.target.closest("[data-del],[data-add]");if(!t||!ED)return;
if(t.dataset.del){var a=t.dataset.del.split("."),i=+a.pop();get(a.join(".")).splice(i,1);if(a.join(".")==="teams")st.g=null;draw()}
else{var p=t.dataset.add,k=p.split(".").pop(),n=NEW[k]();get(p).push(n);if(k==="teams")st.g=n.id;draw()}});
$("q").addEventListener("keydown",function(e){if(e.key!=="Enter")return;var v=this.value.toLowerCase(),f=DATA.teams.filter(function(x){return x.n.toLowerCase().indexOf(v)>-1||x.s.toLowerCase()===v})[0];if(f&&v){st.g=f.id;draw()}});
draw();
</script></body></html>
