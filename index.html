return'<div class="title"><h1>Classement 2026</h1></div><div class="tr h"><span>#</span><span>Équipe</span><span>Points</span><span class="c4">Championnat</span></div>'+rows.map(function(t){return'<div class="tr"><b>'+esc(t.rk)+'</b><button data-g="'+t.id+'"><i style="background:'+t.c+'">'+esc(t.s)+'</i>'+esc(t.n)+'</button><span>'+T("teams."+gi(t.id)+".pts")+'</span><span class="c4">'+esc(t.ch)+'</span></div>'}).join("")+'<p class="note">Classement 2026, trié automatiquement par points : l’équipe qui a le plus de points passe devant.</p>'}

function draw(){
ranked();
document.body.classList.toggle("edit",ED);
var i=st.g?gi(st.g):-1;if(st.g&&i<0)st.g=null;
document.documentElement.style.setProperty("--ac",i>-1?DATA.teams[i].c:"#8fd14f");
$("side").innerHTML='<button class="g home" data-home="1" aria-label="Accueil">⌂</button><span class="sep"></span>'+DATA.teams.map(function(x){return tile(x,"g"+(x.id===st.g?" on":""))}).join("")+(ED?'<button class="g home" data-add="teams" aria-label="Ajouter une équipe">+</button>':"");

$("view").innerHTML=st.mp&&okp(st.mp)?mpage(st.mp):i>-1?team(i):st.ev!=null&&DATA.cal[st.ev]?evpage(st.ev):st.tab==="Équipes"?'<div class="title"><h1>Équipes</h1></div>'+grid():st.tab==="Calendrier"?'<div class="title"><h1>Calendrier '+DATA.season+'</h1></div>'+evs()+A("cal","Ajouter un événement"):st.tab==="Classement"?rank():st.tab==="Stats"?stpage():st.tab==="Palmarès"?pal():home();
document.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){st.mp=null;st.g=b.dataset.g;draw();window.scrollTo(0,0)}});
document.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){st.mp=null;st.tab=b.dataset.t;st.g=null;st.ev=null;draw();window.scrollTo(0,0)}});

document.querySelectorAll("[data-back]").forEach(function(b){b.onclick=function(){st.ev=null;draw()}});
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){st.back={g:st.g,tab:st.tab,ev:st.ev,sub:st.sub};st.ms=null;st.mp=b.dataset.m;draw();window.scrollTo(0,0)}});
document.querySelectorAll("[data-mback]").forEach(function(b){b.onclick=function(){Object.assign(st,st.back||{});st.mp=null;draw()}});
document.querySelectorAll("[data-ss]").forEach(function(b){b.onclick=function(){st.ss=b.dataset.ss;draw()}});
document.querySelectorAll("[data-ms]").forEach(function(b){b.onclick=function(){st.ms=b.dataset.ms;draw()}});
bar()}
function msg(t){var m=$("ms");if(m)m.textContent=t}
function bar(){var b=$("bar");
if(!TOK){b.innerHTML='<button class="pb" id="lg" title="Espace admin" aria-label="Espace admin" style="opacity:.4">🔒</button><span id="ms"></span>';$("lg").onclick=login;return}
b.innerHTML=(ED?'<button class="pb pri" id="sv">Enregistrer</button><button class="pb" id="cn">Annuler</button>':'<button class="pb" id="ed">Mode édition</button><button class="pb" id="lo">Quitter</button>')+'<span id="ms"></span>';
if(ED){$("sv").onclick=save;$("cn").onclick=function(){DATA=JSON.parse(SAVED);ED=false;draw()}}
else{$("ed").onclick=function(){ED=true;draw()};$("lo").onclick=function(){try{localStorage.removeItem("ob_tok")}catch(e){}TOK=null;ED=false;draw()}}}
/* ===== Édition via GitHub (dépôt zaineTV/opsboard) ===== */
var GH={o:"zaineTV",r:"opsboard",p:"index.html"},TOK=null;try{TOK=localStorage.getItem("ob_tok")}catch(e){}
async function gh(m,u,b){var r=await fetch("https://api.github.com/repos/"+GH.o+"/"+GH.r+u,{method:m,cache:"no-store",headers:{Authorization:"Bearer "+TOK,Accept:"application/vnd.github+json"},body:b?JSON.stringify(b):undefined});var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.message||("erreur "+r.status));return j}
async function login(){var t=prompt("Colle ton jeton GitHub (il reste uniquement dans ce navigateur) :");if(!t)return;TOK=t.trim();
try{await gh("GET","");try{localStorage.setItem("ob_tok",TOK)}catch(e){}draw()}catch(e){TOK=null;alert("Connexion refusée : "+e.message+"\n(404 = le jeton n’a pas accès à ce dépôt ; 401 = jeton invalide ou expiré)")}}
function b64(s){var b=new TextEncoder().encode(s),r="",i=0;for(;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)}
async function save(){msg("Enregistrement…");
try{var cur=await gh("GET","/contents/"+GH.p),h=new TextDecoder().decode(Uint8Array.from(atob(cur.content.replace(/\n/g,"")),function(c){return c.charCodeAt(0)})),re=/var DATA=\/\*S\*\/[\s\S]*?\/\*E\*\/;/;
if(!re.test(h))throw new Error("repères de données introuvables dans le fichier du dépôt");
var j=JSON.stringify(DATA).replace(/</g,"\\u003c"),n=h.replace(re,function(){return"var DATA=/*S*/"+j+"/*E*/;"});
await gh("PUT","/contents/"+GH.p,{message:"Mise à jour du contenu",content:b64(n),sha:cur.sha});
SAVED=JSON.stringify(DATA);ED=false;draw();msg("Enregistré ✔ — visible en ligne dans quelques secondes")}
catch(e){msg("Échec : "+e.message)}}
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.e!==undefined)setp(t.dataset.e,t.textContent)});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.e!==undefined){e.preventDefault();e.target.blur()}});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.c){setp(t.dataset.c,t.value);draw()}});
document.addEventListener("click",function(e){var t=e.target.closest("[data-del],[data-add],[data-img],[data-rm]");if(!t||!ED)return;
if(t.dataset.del){var a=t.dataset.del.split("."),i=+a.pop();get(a.join(".")).splice(i,1);if(a.join(".")==="teams")st.g=null;draw()}
else if(t.dataset.img){imgPath=t.dataset.img;$("file").click()}else if(t.dataset.rm){setp(t.dataset.rm,"");draw()}else{var p=t.dataset.add,k=p.split(".").pop(),n=NEW[k]();get(p).push(n);if(k==="teams")st.g=n.id;draw()}});
function nxt(i){var t=DATA.teams[i],b="teams."+i,am=NM(t),h;
if(am){var nb=b+".matches."+t.matches.indexOf(am);h='<div class="nm"><div class="tm">'+LG(nb+".la",am.a,am.ac)+T(nb+".a")+'</div><div>-<br><small style="color:var(--mu)">'+T(nb+".ev")+'<br>'+T(nb+".dt")+' · '+T(nb+".tm")+'</small></div><div class="tm">'+LG(nb+".lb",am.b,am.bc)+T(nb+".b")+'</div></div>'}
else{var n=b+".next";h='<div class="nm"><div class="tm"><i style="background:'+t.c+'">'+esc(t.s)+'</i>'+esc(t.n)+'</div><div>vs</div><div class="tm"><i style="background:var(--bg3);color:var(--tx)">?</i>'+T(n+".b")+'</div></div><p class="ed2" style="text-align:center;margin:10px 0 0">'+T(n+".ev")+'<br>'+T(n+".dt")+' '+T(n+".tm")+'</p>'}
return h+chs()}
function chs(){return'<div class="chs"><small>Où regarder (chaînes officielles)</small><br>'+DATA.ch.map(function(c,k){var q="ch."+k;return ED?'<div class="row" style="margin:4px 0">'+T(q+".0")+T(q+".1")+X(q)+'</div>':'<a class="lnk" href="'+(/^https?:\/\//.test(c[1])?esc(c[1]):"#")+'" target="_blank" rel="noopener">'+esc(c[0])+'</a>'}).join("")+A("ch","Ajouter une chaîne")+'</div>'}
var PREV={},imgPath=null;
function U(s){return PREV[s]||s}

function shrink(f){return new Promise(function(ok,ko){var u=URL.createObjectURL(f),im=new Image();im.onerror=function(){ko(new Error("image illisible"))};
im.onload=function(){var png=f.type!=="image/jpeg",m=png?700:1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var d=c.toDataURL(png?"image/png":"image/jpeg",.85);URL.revokeObjectURL(u);ok({ext:png?"png":"jpg",b64:d.split(",")[1],url:d})};im.src=u})}
$("file").onchange=async function(){var f=this.files[0];this.value="";if(!f||!imgPath)return;msg("Import de l’image…");
try{var o=await shrink(f),name="images/"+Date.now()+"."+o.ext;await gh("PUT","/contents/"+name,{message:"Ajout d’une image",content:o.b64});PREV[name]=o.url;setp(imgPath,name);draw();msg("Image ajoutée — pense à Enregistrer.")}
catch(e){msg("Échec de l’import : "+e.message)}};

draw();
